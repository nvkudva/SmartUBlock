name: Samsung Internet build

on:
  workflow_dispatch:
  push:
    branches: [ master, samsung ]

permissions:
  contents: read

jobs:
  build:
    name: Build Samsung Internet package
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build package
        run: |
          # Chromium caps each version part at 65535 and bans leading zeros
          VERSION="$(date -u +%Y).$((10#$(date -u +%m%d))).$((10#$(date -u +%H%M)))"
          tools/make-mv3.sh samsung "$VERSION"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: samsung-package
          path: dist/build/uBOLite_*.samsung.zip
